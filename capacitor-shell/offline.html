<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F3EBDD">
<title>Offline</title>
<style>
  /* Cream, Ink and Burnt Orange (app/globals.css), inlined: this page ships without the app's CSS. */
  :root {
    --cream: #F3EBDD; --cream-raised: #FCF8F1; --cream-line: #E2D6C2; --ink: #1A1714; --ink-muted: #5E564C;
    --accent: #BF5700; --accent-hover: #A34A00; --accent-text: #A3420B;
    --safe-top: var(--safe-area-inset-top, env(safe-area-inset-top, 0px));
    --safe-bottom: var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center;
    padding: calc(24px + var(--safe-top)) 24px calc(24px + var(--safe-bottom));
    background: var(--cream); color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 22rem; text-align: center; }
  .mark {
    display: inline-grid; place-items: center; width: 48px; height: 48px; border-radius: 14px;
    background: var(--cream-raised); border: 1px solid var(--cream-line); color: var(--accent-text); font-weight: 600; margin-bottom: 20px;
  }
  h1 { font-size: 22px; line-height: 1.2; font-weight: 600; margin: 0 0 8px; }
  p { color: var(--ink-muted); margin: 0 0 24px; }
  button {
    min-height: 44px; padding: 0 20px; border: 0; border-radius: 12px;
    background: var(--accent); color: #FFFFFF; font: inherit; font-weight: 600; cursor: pointer;
  }
  button:hover { background: var(--accent-hover); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">L</div>
  <h1>You're offline</h1>
  <p>Lufer needs a connection to load your bookings. Check your network and try again.</p>
  <button type="button" onclick="history.length > 1 ? history.back() : location.reload()">Try again</button>
</main>
</body>
</html>
