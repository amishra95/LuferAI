<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#2A1B3D">
<title>Offline</title>
<style>
  /* Velvet Night (app/globals.css), inlined: this page ships without the app's CSS. */
  :root {
    --plum: #2A1B3D; --plum-light: #3A2A50; --gold: #F2C14E; --coral: #FF6B4A; --coral-hover: #E85A3A;
    --ink: #1A1523; --linen: #FAF6F0; --on-plum-muted: #C9BEDA;
    --safe-top: var(--safe-area-inset-top, env(safe-area-inset-top, 0px));
    --safe-bottom: var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center;
    padding: calc(24px + var(--safe-top)) 24px calc(24px + var(--safe-bottom));
    background: var(--plum); color: var(--linen);
    font: 15px/1.5 "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 22rem; text-align: center; }
  .mark {
    display: inline-grid; place-items: center; width: 48px; height: 48px; border-radius: 14px;
    background: var(--plum-light); color: var(--gold); font-weight: 600; margin-bottom: 20px;
  }
  h1 { font-size: 22px; line-height: 1.2; font-weight: 600; margin: 0 0 8px; }
  p { color: var(--on-plum-muted); margin: 0 0 24px; }
  button {
    min-height: 44px; padding: 0 20px; border: 0; border-radius: 12px;
    background: var(--coral); color: var(--ink); font: inherit; font-weight: 600; cursor: pointer;
  }
  button:hover { background: var(--coral-hover); }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">L</div>
  <h1>You're offline</h1>
  <p>LuferAI needs a connection to load your bookings. Check your network and try again.</p>
  <button type="button" onclick="history.length > 1 ? history.back() : location.reload()">Try again</button>
</main>
</body>
</html>
