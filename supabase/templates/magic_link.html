<!doctype html>
<html>
  <body style="margin:0;padding:24px;background:#f7f3ee;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#2a1b3d;line-height:1.5">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:12px;padding:32px">
      <tr><td>
        <p style="margin:0 0 24px;font-size:20px;font-weight:700;letter-spacing:-0.01em">Lufer</p>
        <h1 style="margin:0 0 12px;font-size:20px">Sign in to Lufer</h1>
        <p style="margin:0 0 24px">Tap the button to sign in. The link works once and expires in one hour.</p>
        <p style="margin:0 0 24px">
          <a href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&type=email" style="display:inline-block;background:#2a1b3d;color:#ffffff;text-decoration:none;padding:12px 20px;border-radius:8px;font-weight:600">Sign in</a>
        </p>
        <p style="margin:0;color:#6b5f73;font-size:14px">If you didn't ask to sign in, you can ignore this email.</p>
      </td></tr>
    </table>
  </body>
</html>
