<!doctype html>
<html>
  <body style="margin:0;padding:24px;background:#f5f2ec;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#111111;line-height:1.5">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:12px;padding:32px">
      <tr><td>
        <p style="margin:0 0 24px;font-size:20px;font-weight:700;letter-spacing:-0.01em">Lufer</p>
        <h1 style="margin:0 0 12px;font-size:20px">Confirm your email</h1>
        <p style="margin:0 0 24px">Tap the button to confirm it's you. Your Lufer account opens straight away. The link works once and expires in one hour.</p>
        <p style="margin:0 0 24px">
          <a href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&type=email" style="display:inline-block;background:#ff4d1a;color:#111111;text-decoration:none;padding:12px 20px;border-radius:8px;font-weight:600">Confirm and sign in</a>
        </p>
        <p style="margin:0;color:#5c574f;font-size:14px">If you didn't sign up for Lufer, you can ignore this email.</p>
      </td></tr>
    </table>
  </body>
</html>
