# Quality gates for every pull request and every push to main.
#
#   gates  typecheck · lint · test, in parallel. fail-fast cancels the others
#          as soon as one fails.
#   build  `next build`, only once every gate has passed.
#
# Each gate is the same npm script you run locally (npm run typecheck / lint /
# test / build), so CI and your machine can't disagree. No secrets are needed:
# the RLS tests run Postgres in-process (PGlite), and the build works without
# Supabase, Redis or OpenAI keys.
#
# To keep failing code out of production, require the "CI" checks before merging
# to main (GitHub → Settings → Branches) and enable Vercel's Deployment Checks
# (Project → Settings → Deployment Checks) so a deploy isn't promoted until they pass.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR supersedes the running check; runs on main always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: 1
  # AI SDK 7 and the Node runtime on Vercel: Node 24 LTS.
  NODE_VERSION: 24

jobs:
  gates:
    name: ${{ matrix.gate }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        gate: [typecheck, lint, test]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # typecheck: `next typegen` first, since next-env.d.ts and the route types are generated, not committed.
      # lint: fails on any warning. test: unit tests plus the PGlite RLS suite.
      - name: npm run ${{ matrix.gate }}
        run: npm run ${{ matrix.gate }}

  build:
    name: build
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'components/**', 'lib/**', 'workflows/**', 'types/**', '*.ts', '*.mjs', '*.json') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: next build
        run: npm run build
